[versions]
adsIdentifier = "3.4.91.301"
adsIdentifierVersion = "1.0.3.300"
agp = "9.4.1"
android_cn_oaidVersion = "4.2.17"
comGoogleCodeGsonGson = "2.15.0"
coreSplashscreenVersion = "1.2.0"
glide = "5.0.9"
core = "3.5.4"
junit = "4.13.2"
junitVersion = "1.3.0"
appcompat = "1.8.0"
lifecycleViewmodel = "2.11.0"
lifecycleLivedata = "2.11.0"
materialVersion = "1.14.0"
activity = "1.13.0"
okhttp = "5.5.1"
sensebot = "4.4.4"
ucrop = "2.2.11"

# Kotlin 版本同时驱动 kotlin-stdlib 与 Compose 编译器插件，
# 两者必须同版本（compose-compiler 与 KGP 按同一 Kotlin 版本发布）。
kotlin = "2.4.21"
hilt = "2.60.1"

# Compose BOM：统一管理 compose-* 各库版本，新增 Compose 依赖不再单独写版本号。
composeBom = "2026.09.00"

# 液态玻璃
backdrop = "2.0.1"

datastoreRx = "1.3.0"
rxjava3 = "3.1.12"
work = "2.12.0"

[libraries]
ads-identifier = { module = "com.huawei.hms:ads-identifier", version.ref = "adsIdentifier" }
com-google-code-gson-gson3 = { module = "com.google.code.gson:gson", version.ref = "comGoogleCodeGsonGson" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreenVersion" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
gzu-liyujiang-android_cn_oaid = { module = "com.github.gzu-liyujiang:Android_CN_OAID", version.ref = "android_cn_oaidVersion" }
com-google-zxing-core = { module = "com.google.zxing:core", version.ref = "core" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycleViewmodel" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycleLivedata" }
material = { module = "com.google.android.material:material", version.ref = "materialVersion" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
mcs-ads-identifier = { module = "com.hihonor.mcs:ads-identifier", version.ref = "adsIdentifierVersion" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
sensebot = { module = "com.geetest.sensebot:sensebot", version.ref = "sensebot" }
ucrop = { module = "com.github.yalantis:ucrop", version.ref = "ucrop" }


# ===== Jetpack Compose（版本由 compose-bom 统一约束） =====
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
datastore-preferences-rxjava3 = { group = "androidx.datastore", name = "datastore-preferences-rxjava3", version.ref = "datastoreRx" }
rxjava3 = { group = "io.reactivex.rxjava3", name = "rxjava", version.ref = "rxjava3" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hiltAndroid = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

