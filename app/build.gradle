plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.hiltAndroid)
}

android {
    namespace = 'com.muxiao.Venus'
    compileSdk = 37

    // netguard 用户态协议栈（VPN 抓包链路）所需 NDK
    ndkVersion = "28.2.13676358"

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    defaultConfig {
        applicationId = "com.muxiao.Venus"
        minSdk = 24
        targetSdk = 37
        compileSdkMinor = 1
        versionCode = 12
        versionName = "0.0.12"

        buildConfigField "int", "VERSION_CODE", "${defaultConfig.versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${defaultConfig.versionName}\""

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // 注意：release 无法安装到 x86_64 模拟器（模拟器请用 debug 包）。
        // 另：adb 二进制的 assets 只内置 arm/ARM64，模拟器上的 ADB 抓取会提示组件缺失，属预期限制。
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    signingConfigs {
        release {
            def storeFileProp = project.findProperty('VENUS_STORE_FILE')
            if (storeFileProp != null) {
                storeFile = file(storeFileProp)
                storePassword = project.findProperty('VENUS_STORE_PASSWORD')
                keyAlias = project.findProperty('VENUS_KEY_ALIAS')
                keyPassword = project.findProperty('VENUS_KEY_PASSWORD')
            }
            // minSdk 24，Android 7.0+ 仅校验 V2+ 签名
            enableV1Signing = false
            enableV2Signing = true
            enableV3Signing = true
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
        debug {
            debuggable = true
            jniDebuggable = true
            pseudoLocalesEnabled = true
        }
    }
    // LocaleHelper 支持运行时动态切换语言（简/繁/英），禁用按语言拆分，
    // 确保所有语言资源都打包进基础 APK，避免 Bundle 分发下切换语言后资源缺失。
    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    androidResources {
        // AGP 9 起 resConfigs 弃用，迁移到 localeFilters（简/繁/英三语言，与 LocaleHelper 对应）
        localeFilters += ["zh-rCN", "zh-rTW", "en"]
        // OkHttp 的 PublicSuffixDatabase.list 只在 Cookie.domainMatches() 时按需读取。本项目 Cookie
        // 一律由 HeaderManager 自己拼请求头、全程没有 CookieJar，该表是纯死重（assets 里占 41.5KB）。
        // 注意：该属性是整体覆盖而非追加，必须把 AGP 默认忽略模式一起写上。
        // 同时排除 assets/adb/**：ADB 二进制（libadb.bin）改为首次使用时按需下载，APK 零增量。
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!PublicSuffixDatabase.list"
    }
    // assets/adb 重命名为 assets/_adb 以触发 <dir>_* 忽略规则（无需改 ignoreAssetsPattern）。
    // AdbGachaCapture.extractAdb 里 getAssets().open("adb/...") 找不到时自动 fallback 到云端下载。
    packagingOptions {
        resources {
            excludes += [
                'META-INF/NOTICE.txt',
                'META-INF/LICENSE.txt',
                'META-INF/DEPENDENCIES',
                'META-INF/NOTICE',
                'META-INF/LICENSE',
                'META-INF/services/javax.imageio.spi.ImageInputStreamSpi',
                'META-INF/services/javax.imageio.spi.ImageOutputStreamSpi',
                'META-INF/services/javax.imageio.spi.ImageReaderSpi',
                'META-INF/services/javax.imageio.spi.ImageWriterSpi',
                'META-INF/**/LICENSE*',
                'META-INF/**/NOTICE*',
                'META-INF/*.kotlin_module',
                'META-INF/proguard/*',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                // baseline.prof / .profm：AGP 默认生成的空 baseline profile 占位（没配 Baseline Profile 生成任务），
                // 占 ~11.5 KB 且无实际运行时收益；DebugProbesKt.bin 在 release R8 full mode 下通常自动剥离，
                // 但这里显式排除避免历史 Kotlin 版本残留。
                'assets/dexopt/baseline.prof',
                'assets/dexopt/baseline.profm',
                'DebugProbesKt.bin'
            ]
        }
        jniLibs {
            // adb 二进制以 .bin 存于 assets 压缩存放（.so 可能被 AGP 默认不压缩）；保持 false 避免解包其他 .so
            useLegacyPackaging = false
            // onnxruntime-android 只取 Java 绑定类（classes.jar 108KiB）：两个 native .so 剥离出 APK，
            // 由 OrtLoader/SolverAssetManager 按设备 ABI 下载后 System.load（APK 体积零增量）。
            // 注意 JNI 库实际文件名是 libonnxruntime4j_jni.so（4j_jni 带下划线）。
            // 版本必须与组件清单里的 .so 严格一致（JNI ABI 耦合）。
            excludes += ['**/libonnxruntime.so', '**/libonnxruntime4j_jni.so']
        }
    }

}

// 单 module（仅 :app）项目无需跨 module 依赖聚合任务，关闭以减少不必要的构建步骤。
hilt {
    enableAggregatingTask = false
}

dependencies {
    implementation platform(libs.compose.bom)
    androidTestImplementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.material3
    compileOnly libs.compose.tooling.preview
    debugImplementation libs.compose.tooling
    debugImplementation libs.compose.tooling.preview
    androidTestImplementation libs.compose.test.junit4
    debugImplementation libs.compose.test.manifest

    // 液态玻璃渲染核心
    implementation(libs.backdrop)

    implementation libs.core.splashscreen
    implementation libs.gzu.liyujiang.android.cn.oaid
    runtimeOnly libs.ads.identifier
    runtimeOnly libs.mcs.ads.identifier
    implementation libs.sensebot
    implementation libs.okhttp
    implementation libs.qrcodegen
    implementation libs.activity
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.com.google.code.gson.gson3
    implementation libs.glide
    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler
    implementation libs.datastore.preferences.rxjava3
    implementation libs.rxjava3
    implementation libs.androidx.work.runtime
    implementation libs.onnxruntime.android
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
}
